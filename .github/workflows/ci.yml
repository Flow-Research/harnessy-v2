name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-check-test:
    name: Harnessy build, QA, and packages
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22.22.2
          cache: npm

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep
          sudo ln -s "$(which fdfind)" /usr/local/bin/fd

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Audit root dependencies
        run: npm audit --audit-level=moderate

      - name: Install Executor dependencies
        working-directory: executor
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Audit Executor dependency graph
        run: npm run audit:executor

      - name: Build current-platform Executor fixture input
        run: npm run build:executor-runtime

      - name: Build
        run: npm run build

      - name: Verify V1 compatibility projection
        run: npm run verify:v1-compatibility

      - name: Smoke test source cockpit headlessly
        run: node scripts/check-harnessy-cockpit.mjs

      - name: Check
        run: npm run check

      - name: Check must not rewrite tracked files
        run: git diff --exit-code

      - name: Validate canonical QA inventory, drift, coverage, and feature catalog
        run: npm run qa:check

      - name: Test repo-owned QA runtime and catalog contracts
        run: npm run test:qa-contract

      - name: Prepare private Node runtime for security-bound QA
        run: |
          private_node_root="$RUNNER_TEMP/harnessy-node"
          install -d -m 700 "$private_node_root/bin"
          node_runtime="$(command -v node)"
          install -m 700 "$node_runtime" "$private_node_root/bin/node"
          echo "HARNESSY_NODE_RUNTIME=$node_runtime" >> "$GITHUB_ENV"
          echo "$private_node_root/bin" >> "$GITHUB_PATH"

      - name: Execute canonical-cutover QA scenarios
        run: npm run test:qa-scenarios

      - name: Test packed private SDK consumer explicitly
        run: npm run test:sdk-fixture

      - name: Test packed private local-host consumer explicitly
        run: npm run test:local-host-fixture

      - name: QA and packed gates must not rewrite tracked files
        run: git diff --exit-code

      - name: Test workspace without user credentials
        run: ./test.sh

      - name: Enforce Harnessy source coverage floors
        run: npm run test:coverage

      - name: Test packed Harnessy engine consumer
        run: npm run test:engine-fixture

      - name: Test Executor package contracts
        run: npm run test:executor-package-contract

      - name: Test packed Harnessy release artifacts
        run: npm run test:release-artifacts

      - name: Generated and packed gates must leave no tracked or untracked output
        run: npm run check:clean-worktree

  executor:
    name: Executor source
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22.22.2

      - name: Install Executor dependencies
        working-directory: executor
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Audit Executor dependency graph
        run: npm run audit:executor

      - name: Build allowlisted native test dependency
        working-directory: executor
        run: bun run prepare:native-test-deps

      - name: Verify patched dependencies
        working-directory: executor
        run: bun run check:patches

      - name: Check Executor formatting
        working-directory: executor
        run: bun run format:check

      - name: Lint, typecheck, and test Executor
        working-directory: executor
        run: bun run ci

  supply-chain:
    name: Supply-chain evidence
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22.22.2
          cache: npm

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Setup Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.11'

      - name: Install release evidence npm pin
        run: npm install --global --ignore-scripts npm@11.6.0

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Executor dependencies
        working-directory: executor
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build package inputs
        run: npm run build

      - name: Test and generate deterministic supply-chain evidence
        run: |
          npm run test:supply-chain
          npm run supply-chain:generate
          npm run supply-chain:verify
          npm run supply-chain:reproducibility

      - name: Upload supply-chain evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: supply-chain-${{ github.run_id }}-${{ github.sha }}
          path: .supply-chain-evidence/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

  packaged-executor:
    name: Packaged Executor (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22.22.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Install Executor dependencies
        working-directory: executor
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Test package launcher and manifest regressions on this platform
        run: node --test scripts/harnessy-executor-package-lib.test.mjs

      - name: Pack, install, audit, and execute current-platform runtime
        run: npm run test:executor-package-integration
