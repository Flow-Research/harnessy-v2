name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The Harnessy gates run as parallel jobs that share one build. Every gate job
  # restores the same build outputs and ends with its own tracked-file and
  # clean-worktree checks. The aggregate job keeps the historical required check
  # name and fails unless every gate job succeeded.
  build:
    name: Harnessy build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup workspace
        uses: ./.github/actions/harnessy-ci-setup

      - name: Audit root dependencies
        run: npm run audit:root

      - name: Audit Executor dependency graph
        run: npm run audit:executor

      - name: Mark build start
        run: touch "$RUNNER_TEMP/harnessy-build-start"

      - name: Build current-platform Executor fixture input
        run: npm run build:executor-runtime

      - name: Build
        run: npm run build

      - name: Build must not rewrite tracked files
        run: git diff --exit-code

      - name: Package build outputs
        run: |
          # Every file the build created or changed (including ignored output under
          # node_modules and the Executor task cache); ctime cannot be preserved by copies.
          find . -path ./.git -prune -o ! -type d -cnewer "$RUNNER_TEMP/harnessy-build-start" -print0 \
            | LC_ALL=C sort -z > "$RUNNER_TEMP/harnessy-build-files"
          test -s "$RUNNER_TEMP/harnessy-build-files"
          mkdir -p "$RUNNER_TEMP/harnessy-build"
          tar --null --no-recursion -T "$RUNNER_TEMP/harnessy-build-files" -czf "$RUNNER_TEMP/harnessy-build/harnessy-build.tar.gz"
          git rev-parse HEAD > "$RUNNER_TEMP/harnessy-build/harnessy-build.sha"
          echo "Packaged $(tr -cd '\0' < "$RUNNER_TEMP/harnessy-build-files" | wc -c) build output files ($(du -h "$RUNNER_TEMP/harnessy-build/harnessy-build.tar.gz" | cut -f1)) for $(cat "$RUNNER_TEMP/harnessy-build/harnessy-build.sha")."

      - name: Upload build outputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: harnessy-build-${{ github.run_id }}-${{ github.sha }}
          # A re-run of the build job replaces this run's artifact instead of failing.
          path: |
            ${{ runner.temp }}/harnessy-build/harnessy-build.tar.gz
            ${{ runner.temp }}/harnessy-build/harnessy-build.sha
          if-no-files-found: error
          overwrite: true
          compression-level: 0
          retention-days: 1

      - name: Build must leave no tracked or untracked output
        run: npm run check:clean-worktree

  static-checks:
    name: Harnessy check and QA inventory
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup workspace
        uses: ./.github/actions/harnessy-ci-setup
        with:
          build-artifact: harnessy-build-${{ github.run_id }}-${{ github.sha }}

      - name: Verify V1 compatibility projection
        run: npm run verify:v1-compatibility

      - name: Smoke test source cockpit headlessly
        run: node scripts/check-harnessy-cockpit.mjs

      - name: Smoke the Harnessy app in headless Chrome (fails on any CSP violation)
        run: node scripts/check-portal-app-browser.mjs

      - name: Check the Executor cockpit CSP, sign-in redirect and code exchange in headless Chrome
        run: node scripts/check-executor-cockpit-browser.mjs

      - name: Check
        run: npm run check

      - name: Check must not rewrite tracked files
        run: git diff --exit-code

      - name: Validate canonical QA inventory, drift, coverage, and feature catalog
        run: npm run qa:check

      - name: Test repo-owned QA runtime and catalog contracts
        run: npm run test:qa-contract

      - name: Static gates must not rewrite tracked files
        run: git diff --exit-code

      - name: Static gates must leave no tracked or untracked output
        run: npm run check:clean-worktree

  qa-scenarios:
    name: Harnessy QA scenarios and packed SDK and engine consumers
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup workspace
        uses: ./.github/actions/harnessy-ci-setup
        with:
          build-artifact: harnessy-build-${{ github.run_id }}-${{ github.sha }}
          test-runtime: "true"

      - name: Test community adapters in the isolated Jarvis runtime
        run: |
          "$HARNESSY_TEST_JARVIS_PYTHON" scripts/test-community-draft-adapter.py
          "$HARNESSY_TEST_JARVIS_PYTHON" -I -B scripts/test-community-collector-pruning.py
          "$HARNESSY_TEST_JARVIS_PYTHON" scripts/test-community-review-consumer.py

      - name: Execute canonical-cutover QA scenarios
        run: npm run test:qa-scenarios

      - name: Test packed private SDK consumer explicitly
        run: npm run test:sdk-fixture

      - name: Test packed Harnessy engine consumer
        run: npm run test:engine-fixture

      - name: Test Executor package contracts
        run: npm run test:executor-package-contract

      - name: QA and packed gates must not rewrite tracked files
        run: git diff --exit-code

      - name: QA and packed gates must leave no tracked or untracked output
        run: npm run check:clean-worktree

  local-host-fixture:
    name: Harnessy packed local-host consumer
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup workspace
        uses: ./.github/actions/harnessy-ci-setup
        with:
          build-artifact: harnessy-build-${{ github.run_id }}-${{ github.sha }}
          test-runtime: "true"

      - name: Test packed private local-host consumer explicitly
        run: npm run test:local-host-fixture

      - name: Packed local-host gate must not rewrite tracked files
        run: git diff --exit-code

      - name: Packed local-host gate must leave no tracked or untracked output
        run: npm run check:clean-worktree

  workspace-tests:
    name: Harnessy workspace tests without user credentials
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup workspace
        uses: ./.github/actions/harnessy-ci-setup
        with:
          build-artifact: harnessy-build-${{ github.run_id }}-${{ github.sha }}
          test-runtime: "true"

      - name: Test workspace without user credentials
        run: ./test.sh

      - name: Workspace tests must not rewrite tracked files
        run: git diff --exit-code

      - name: Workspace tests must leave no tracked or untracked output
        run: npm run check:clean-worktree

  coverage:
    name: Harnessy source coverage floors
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup workspace
        uses: ./.github/actions/harnessy-ci-setup
        with:
          build-artifact: harnessy-build-${{ github.run_id }}-${{ github.sha }}
          test-runtime: "true"

      - name: Enforce Harnessy source coverage floors
        run: npm run test:coverage

      - name: Coverage gate must not rewrite tracked files
        run: git diff --exit-code

      - name: Coverage gate must leave no tracked or untracked output
        run: npm run check:clean-worktree

  release-installed-local-host:
    name: Harnessy packed release local-host consumer
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup workspace
        uses: ./.github/actions/harnessy-ci-setup
        with:
          build-artifact: harnessy-build-${{ github.run_id }}-${{ github.sha }}
          test-runtime: "true"

      - name: Test packed Harnessy release artifacts (installed local-host consumer)
        run: npm run test:release-artifacts:installed-local-host

      - name: Packed release gate must not rewrite tracked files
        run: git diff --exit-code

      - name: Packed release gate must leave no tracked or untracked output
        run: npm run check:clean-worktree

  release-installed-product:
    name: Harnessy packed release product consumer
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup workspace
        uses: ./.github/actions/harnessy-ci-setup
        with:
          build-artifact: harnessy-build-${{ github.run_id }}-${{ github.sha }}
          test-runtime: "true"

      - name: Test packed Harnessy release artifacts (installed product consumer)
        run: npm run test:release-artifacts:installed-product

      - name: Packed release gate must not rewrite tracked files
        run: git diff --exit-code

      - name: Packed release gate must leave no tracked or untracked output
        run: npm run check:clean-worktree

  build-check-test:
    name: Harnessy build, QA, and packages
    if: ${{ always() }}
    needs:
      - build
      - static-checks
      - qa-scenarios
      - local-host-fixture
      - workspace-tests
      - coverage
      - release-installed-local-host
      - release-installed-product
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every Harnessy gate job to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS_JSON" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS_JSON" | jq -e 'length > 0 and (to_entries | all(.value.result == "success"))' > /dev/null

  executor:
    name: Executor source
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22.22.2

      - name: Install Executor dependencies
        working-directory: executor
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Audit Executor dependency graph
        run: npm run audit:executor

      - name: Build allowlisted native test dependency
        working-directory: executor
        run: bun run prepare:native-test-deps

      - name: Verify patched dependencies
        working-directory: executor
        run: bun run check:patches

      - name: Check Executor formatting
        working-directory: executor
        run: bun run format:check

      - name: Lint, typecheck, and test Executor
        working-directory: executor
        run: bun run ci

  supply-chain:
    name: Supply-chain evidence
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22.22.2
          cache: npm

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Setup Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.11'

      - name: Install release evidence npm pin
        run: npm install --global --ignore-scripts npm@11.6.0

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Executor dependencies
        working-directory: executor
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build package inputs
        run: npm run build

      - name: Test and generate deterministic supply-chain evidence
        run: |
          npm run test:supply-chain
          npm run supply-chain:generate
          npm run supply-chain:verify
          npm run supply-chain:reproducibility

      - name: Upload supply-chain evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: supply-chain-${{ github.run_id }}-${{ github.sha }}
          path: .supply-chain-evidence/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

  installed-product-acceptance:
    name: Installed product acceptance (macOS)
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22.22.2
          cache: npm

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Setup Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          python -m pip install uv==0.6.10

      - name: Install Executor dependencies
        working-directory: executor
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build package inputs
        run: npm run build

      - name: Test native notification callback parsing
        working-directory: packages/harnessy-sdk
        run: node ../../node_modules/vitest/dist/cli.js --run test/meeting-publication-notifier.test.ts

      - name: Test native reviewer process identity
        working-directory: packages/harnessy-core
        run: node ../../node_modules/vitest/dist/cli.js --run test/community-process-identity.test.ts

      - name: Pack, install, and exercise the macOS product
        run: npm run test:release-artifacts:installed-product

      - name: Installed acceptance must not rewrite tracked files
        run: git diff --exit-code

      - name: Installed acceptance must leave no tracked or untracked output
        run: npm run check:clean-worktree

  installed-local-host-acceptance:
    name: Installed local-host consumer acceptance (macOS)
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22.22.2
          cache: npm

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Setup Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          python -m pip install uv==0.6.10

      - name: Install Executor dependencies
        working-directory: executor
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build package inputs
        run: npm run build

      - name: Pack, install, and exercise the macOS packed local-host consumer
        run: npm run test:release-artifacts:installed-local-host

      - name: Installed acceptance must not rewrite tracked files
        run: git diff --exit-code

      - name: Installed acceptance must leave no tracked or untracked output
        run: npm run check:clean-worktree

  packaged-executor:
    name: Packaged Executor (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22.22.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Install Executor dependencies
        working-directory: executor
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Test package launcher and manifest regressions on this platform
        run: node --test scripts/harnessy-executor-package-lib.test.mjs

      - name: Pack, install, audit, and execute current-platform runtime
        run: npm run test:executor-package-integration
