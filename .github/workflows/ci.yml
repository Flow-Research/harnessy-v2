name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-check-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep
          sudo ln -s $(which fdfind) /usr/local/bin/fd

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Executor dependencies
        working-directory: executor
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build
        run: npm run build

      - name: Smoke test source cockpit headlessly
        run: node scripts/check-harnessy-cockpit.mjs

      - name: Check
        run: npm run check

      - name: Test
        run: npm test

  credential-scan:
    name: Credential Scanner
    uses: Flow-Research/.github/.github/workflows/credential-scanner.yml@e519272096a29214dc6f4f36f1a7de2fc6fba96a

  pr-lint:
    name: PR Template Check
    if: github.event_name == 'pull_request'
    uses: Flow-Research/.github/.github/workflows/pr-template-linter.yml@e519272096a29214dc6f4f36f1a7de2fc6fba96a
    with:
      pr-body: ${{ github.event.pull_request.body }}
