name: Harnessy CI setup
description: >-
  Installs the pinned Node, Bun, npm and Executor dependencies used by the Harnessy
  CI jobs. Optionally restores the build outputs produced by the build job and
  prepares the security-bound test runtime (private Node path and isolated Jarvis
  Python environment).

inputs:
  system-packages:
    description: Install the apt packages used by the workspace tests.
    default: "true"
  build-artifact:
    description: Name of the build-output artifact to restore; empty skips the restore.
    default: ""
  test-runtime:
    description: Prepare the private Node runtime and the isolated Jarvis Python environment.
    default: "false"

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
      with:
        node-version: 22.22.2
        cache: npm

    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: 1.4.0

    - name: Install system dependencies
      if: ${{ inputs.system-packages == 'true' }}
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep poppler-utils
        sudo ln -s "$(which fdfind)" /usr/local/bin/fd

    - name: Install dependencies
      shell: bash
      run: npm ci --ignore-scripts

    - name: Install Executor dependencies
      shell: bash
      working-directory: executor
      run: bun install --frozen-lockfile --ignore-scripts

    - name: Download build outputs
      if: ${{ inputs.build-artifact != '' }}
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: ${{ inputs.build-artifact }}
        path: ${{ runner.temp }}/harnessy-build

    - name: Restore build outputs
      if: ${{ inputs.build-artifact != '' }}
      shell: bash
      run: |
        archive="$RUNNER_TEMP/harnessy-build/harnessy-build.tar.gz"
        test -s "$archive"
        tar -xpzf "$archive"
        git diff --exit-code

    - name: Prepare private Node runtime for security-bound QA
      if: ${{ inputs.test-runtime == 'true' }}
      shell: bash
      run: |
        private_node_root="$RUNNER_TEMP/harnessy-node"
        install -d -m 700 "$private_node_root/bin"
        node_runtime="$(command -v node)"
        install -m 700 "$node_runtime" "$private_node_root/bin/node"
        echo "HARNESSY_NODE_RUNTIME=$node_runtime" >> "$GITHUB_ENV"
        echo "$private_node_root/bin" >> "$GITHUB_PATH"

    - name: Setup Python for V2 reused runtime consumers
      if: ${{ inputs.test-runtime == 'true' }}
      uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
      with:
        python-version: '3.11'

    - name: Prepare isolated installed Jarvis test runtime
      if: ${{ inputs.test-runtime == 'true' }}
      shell: bash
      run: |
        python -m pip install uv==0.6.10
        fixture_root=$(mktemp -d "$RUNNER_TEMP/harnessy-jarvis-consumer.XXXXXX")
        cp -R packages/capability-harnessy-v1-full/resources/jarvis-cli "$fixture_root/source"
        UV_PROJECT_ENVIRONMENT="$fixture_root/venv" uv sync --project "$fixture_root/source" --frozen --no-dev --no-editable --python 3.11 --no-python-downloads
        echo "HARNESSY_TEST_JARVIS_PYTHON=$fixture_root/venv/bin/python" >> "$GITHUB_ENV"
