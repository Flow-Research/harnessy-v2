name: personal-knowledge
type: opencode
version: 0.1.0
install_scope: local-repo
owner: harnessy
status: experimental
blast_radius: medium
description: Maintain and query the private V2 personal learning library.
permissions: [read-local-files, write-private-vault, fetch-public-urls, execute-configured-model]
data_categories: [pii]
egress: [user-selected-public-sources, configured-model-provider]
invoke: /personal-knowledge
location: packages/harnessy-core/resources/skills/personal-knowledge
autoresearch:
  enabled: true
  metric_layer: 1
  time_budget_seconds: 1200
  evaluation_window: 3
  constraints:
    max_regression_rate: 0.1
    max_human_intervention: 0.5
